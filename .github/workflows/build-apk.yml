name: Build Android + iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_ios:
        description: "Also upload the signed iOS build to TestFlight/App Store Connect (only meaningful when the Apple secrets are set — see CLAUDE.md's iOS section)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # android/ is intentionally not committed to the repo (see .gitignore)
      # so nobody needs Flutter/Android Studio installed locally just to
      # keep this file in sync. We regenerate it fresh on every build, then
      # patch in the AdMob App ID and INTERNET permission it needs.
      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.trungsmail --project-name dino_egg_shooter .

      - name: Patch AndroidManifest.xml (AdMob + app label)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          set -e
          APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -z "${ADMOB_APP_ID}" ]; then
            echo "::warning::ADMOB_APP_ID secret not set — using Google's TEST AdMob App ID. Ads will show as test ads only. Set the ADMOB_APP_ID secret before publishing."
          fi
          sed -i "s#<application#<uses-permission android:name=\"android.permission.INTERNET\"/>\n  <application#" "$MANIFEST"
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${APP_ID}\"/>\n  </application>#" "$MANIFEST"
          sed -i -E 's/android:label="[^"]*"/android:label="Dino Egg Shooter"/g' "$MANIFEST"
          cat "$MANIFEST"

      # google_mobile_ads requires minSdk 23+ (and a recent compileSdk).
      # flutter create defaults these to `flutter.minSdkVersion` /
      # `flutter.compileSdkVersion`, which can lag behind what current
      # plugins need, so force explicit values here. Handles both the
      # Groovy (build.gradle) and Kotlin DSL (build.gradle.kts) templates
      # since Flutter has changed the default over time.
      - name: Raise minSdk/compileSdk for plugin compatibility
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              echo "Patching $f"
              if [[ "$f" == *.kts ]]; then
                sed -i -E 's/minSdk( )?=.*/minSdk = 23/' "$f"
                sed -i -E 's/compileSdk( )?=.*/compileSdk = 36/' "$f"
              else
                sed -i -E 's/minSdkVersion .*/minSdkVersion 23/' "$f"
                sed -i -E 's/compileSdkVersion .*/compileSdkVersion 36/' "$f"
              fi
              grep -nE 'minSdk|compileSdk' "$f"
            fi
          done

      # Recent AGP versions run R8 aggressively enough by default to strip
      # androidx.work's WorkDatabase_Impl (only referenced via reflection),
      # which crashes every screen with "Unable to get provider
      # androidx.startup.InitializationProvider" / "Failed to create an
      # instance of androidx.work.impl.WorkDatabase" the moment the app
      # opens on a real device — WorkManager gets pulled in transitively by
      # google_mobile_ads. Explicitly enabling shrinking with the matching
      # keep rules (rather than leaving shrinking's default behavior as-is)
      # avoids the crash and also gets a smaller APK.
      - name: Enable release code shrinking (with WorkManager keep rules)
        run: |
          set -e
          cat tool/proguard-rules-extra.pro >> android/app/proguard-rules.pro
          if [ -f android/app/build.gradle.kts ]; then
            perl -0777 -pi -e 's/release \{/release {\n            isMinifyEnabled = true\n            isShrinkResources = true\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")/' android/app/build.gradle.kts
            grep -n -A5 'release {' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            perl -0777 -pi -e 's/release \{/release {\n            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"/' android/app/build.gradle
            grep -n -A5 'release {' android/app/build.gradle
          fi

      # If the KEYSTORE_BASE64 secret is set, decode the release keystore
      # and wire it into android/app/build.gradle(.kts) as the "release"
      # signingConfig via the standard Flutter key.properties pattern
      # (https://docs.flutter.dev/deployment/android#signing-the-app), so
      # the resulting APK/AAB is signed with a real upload key instead of
      # the debug key Play Store rejects. Without the secret, this is a
      # no-op and the build stays debug-signed (fine for sideload testing,
      # not for a store upload). Uses tool/patch_signing.js (not inline
      # sed) since this edit needs a proper multi-line block insert plus an
      # import line for the Kotlin DSL case — fragile as a heredoc nested
      # inside YAML's indentation-sensitive block scalars.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set — building a debug-signed APK/AAB only. Fine for sideloading, NOT acceptable for a Play Store upload."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          node tool/patch_signing.js
          grep -n -A5 'signingConfigs' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      # Reads assets/icon/icon.png and writes it into every
      # android/app/src/main/res/mipmap-*/ launcher icon slot. Must run
      # after "Generate Android platform project" (needs android/ to
      # exist) and after "Install dependencies" (needs the package itself).
      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      # Play Console requires the App Bundle format for new app uploads.
      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dino-egg-shooter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: dino-egg-shooter-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Flutter 3.24+ defaults iOS plugin resolution to Swift Package
      # Manager instead of CocoaPods. Each plugin becoming its own
      # Package.swift target breaks manual signing below (xcodebuild's
      # command-line signing overrides apply to every target in the build,
      # not just Runner, and SPM package targets can't have a provisioning
      # profile at all). Forcing CocoaPods avoids the problem entirely —
      # this is a Flutter *tool* setting, not project-level, so it has to
      # be set again on every fresh runner.
      - name: Force CocoaPods instead of Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      # ios/ is gitignored and regenerated fresh every run, same reasoning
      # as android/ above.
      - name: Generate iOS platform project
        run: flutter create --platforms=ios --org com.trungsmail --project-name dino_egg_shooter .

      # Without this, the build fails with "Include of non-modular header
      # inside framework module 'google_mobile_ads.FLTAd_Internal'" — a
      # well-known CocoaPods integration requirement for this SDK, not
      # specific to this project.
      - name: Patch Podfile (CocoaPods module map fix for google_mobile_ads)
        run: |
          set -e
          perl -0777 -pi -e "s/(flutter_additional_ios_build_settings\(target\))/\$1\n    target.build_configurations.each do |config|\n      config.build_settings['CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES'] = 'YES'\n    end/" ios/Podfile
          cat ios/Podfile

      # The Podfile patch above covers pod targets; the Runner app target
      # itself needs the same setting via its own included xcconfig.
      - name: Patch Debug/Release.xcconfig (same module map fix, for the Runner target)
        run: |
          set -e
          for f in ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig; do
            echo 'CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES = YES' >> "$f"
            cat "$f"
          done

      - name: Install dependencies
        run: flutter pub get

      # google_mobile_ads throws an uncaught NSException the moment
      # MobileAds.instance.initialize() runs without a GADApplicationIdentifier
      # in Info.plist — no real iOS AdMob app exists for this project yet,
      # so this always falls back to Google's public iOS TEST App ID until
      # an ADMOB_APP_ID_IOS secret is set.
      - name: Patch Info.plist (AdMob App ID)
        env:
          ADMOB_APP_ID_IOS: ${{ secrets.ADMOB_APP_ID_IOS }}
        run: |
          set -e
          APP_ID="${ADMOB_APP_ID_IOS:-ca-app-pub-3940256099942544~1458002511}"
          if [ -z "${ADMOB_APP_ID_IOS}" ]; then
            echo "::warning::ADMOB_APP_ID_IOS secret not set — using Google's public iOS TEST AdMob App ID. Ads will show as test ads only until a real iOS AdMob app entry exists."
          fi
          plutil -replace GADApplicationIdentifier -string "$APP_ID" ios/Runner/Info.plist
          # Declares no custom encryption beyond standard HTTPS, skipping
          # App Store Connect's "Export Compliance" upload prompt.
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO ios/Runner/Info.plist

      # A separate flutter_launcher_icons_ios.yaml (not pubspec.yaml's main
      # config, which stays android-only) — sharing one config with
      # `ios: true` would make the Android job try to write iOS icons too.
      - name: Generate launcher icon
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_ios.yaml

      # Manual signing with a pre-created Distribution certificate + App
      # Store provisioning profile — automatic signing
      # (-allowProvisioningUpdates) does not work in headless CI with no
      # device attached and no interactive Xcode session. See this repo's
      # CLAUDE.md iOS section / feedback_ios_ci_signing_setup memory for
      # the full reasoning (validated end-to-end on number99-app first).
      - name: Import signing certificate
        id: ios_signing
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e
          if [ -z "$IOS_DIST_P12_BASE64" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::warning::IOS_DIST_P12_BASE64/IOS_PROVISIONING_PROFILE_BASE64 not set — building unsigned (compile check only), no .ipa will be produced. See CLAUDE.md's iOS section."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$IOS_DIST_P12_BASE64" | base64 -d > ios_distribution.p12
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > ios_profile.mobileprovision
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install certificate into a temporary keychain
        if: steps.ios_signing.outputs.configured == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_P12_PASSWORD }}

      - name: Install provisioning profile
        if: steps.ios_signing.outputs.configured == 'true'
        run: |
          set -e
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ios_profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS (compile + resolve pods)
        run: flutter build ios --release --no-codesign

      # Signing settings go into Release.xcconfig (the Runner target's own
      # included xcconfig), never as xcodebuild command-line overrides —
      # those apply to every target in the build (CocoaPods pod targets
      # included), and pod targets can't have a provisioning profile at all.
      - name: Configure Runner-only signing settings
        if: steps.ios_signing.outputs.configured == 'true'
        env:
          APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          set -e
          {
            echo "DEVELOPMENT_TEAM = ${APPSTORE_TEAM_ID}"
            echo "CODE_SIGN_STYLE = Manual"
            echo "CODE_SIGN_IDENTITY = Apple Distribution"
            echo "PROVISIONING_PROFILE_SPECIFIER = dino-egg-shooter App Store"
          } >> ios/Flutter/Release.xcconfig
          cat ios/Flutter/Release.xcconfig

      - name: Archive and export signed IPA
        if: steps.ios_signing.outputs.configured == 'true'
        env:
          APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        run: |
          set -e
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPSTORE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.trungsmail.dinoEggShooter</key>
              <string>dino-egg-shooter App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA artifact
        if: steps.ios_signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dino-egg-shooter-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      # Only runs on a manual "Run workflow" trigger with the checkbox
      # ticked — never on a plain push to main, same reasoning as the
      # Android job never auto-uploading the .aab to Play Console.
      - name: Upload to TestFlight
        if: steps.ios_signing.outputs.configured == 'true' && github.event_name == 'workflow_dispatch' && inputs.upload_ios == true
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          set -e
          mkdir -p ~/private_keys
          echo "$APPSTORE_API_KEY_P8" | base64 -d > ~/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          xcrun altool --upload-app \
            -f build/ios/ipa/*.ipa \
            -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"
