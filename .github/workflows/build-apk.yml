name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # android/ is intentionally not committed to the repo (see .gitignore)
      # so nobody needs Flutter/Android Studio installed locally just to
      # keep this file in sync. We regenerate it fresh on every build.
      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.trungsmail --project-name dino_egg_shooter .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dino-egg-shooter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
